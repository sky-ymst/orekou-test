services:
  - type: web
    name: orekou-crawler-test
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_render_web.py"
    envVars:
      - key: MAX_GAMES
        value: "100"
      - key: CRAWL_INTERVAL
        value: "5.0"
      - key: CRAWL_JITTER
        value: "2.0"
